name: uptime
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save state if it changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "uptime-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "state" state.json && git push -q
          fi
  # GitHub pauses scheduled workflows after 60 days without commits; a monthly empty commit keeps it alive.
  keepalive:
    if: github.event.schedule == '2-59/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "uptime-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "keepalive" && git push -q
          fi
